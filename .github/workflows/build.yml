name: Build OpenWrt 25.12.5 - Ruijie RG-MA3063

on:
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: "Tag OpenWrt"
        default: "v25.12.5"
        required: true
      fw_memory_mode:
        description: "Mode memori firmware ath11k (1 = hemat, 2 = paling hemat untuk RAM 256 MB)"
        type: choice
        options:
          - "2"
          - "1"
        default: "2"
        required: true
      ath11k_small_rings:
        description: "Kecilkan ring RX/TX ath11k agar RAM lebih lega (disarankan untuk 256 MB)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repo ini
        uses: actions/checkout@v4

      - name: Kosongkan disk runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h /

      - name: Pasang dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Ambil source OpenWrt
        run: |
          git clone --depth 1 --branch "${{ inputs.openwrt_tag }}" \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Terapkan patch MA3063
        working-directory: openwrt
        run: |
          git -c user.name=ci -c user.email=ci@localhost am ../patches/*.patch

      - name: Atur mode memori firmware WiFi
        working-directory: openwrt
        env:
          FW_MEM_MODE: ${{ inputs.fw_memory_mode }}
        run: |
          dts=target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-rg-ma3063.dts
          sed -i -E "s/(qcom,ath11k-fw-memory-mode = <)[0-9]+(>;)/\1${FW_MEM_MODE}\2/" "$dts"
          # Kedua radio (IPQ5018 2.4 GHz dan QCN6102 5 GHz) harus ikut berubah
          test "$(grep -c "qcom,ath11k-fw-memory-mode = <${FW_MEM_MODE}>;" "$dts")" -eq 2
          grep -n "qcom,ath11k-fw-memory-mode" "$dts"

      - name: Patch ath11k ring kecil (hemat RAM)
        if: ${{ inputs.ath11k_small_rings }}
        working-directory: openwrt
        run: |
          cp -v ../patches-mac80211/*.patch package/kernel/mac80211/patches/ath11k/

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Konfigurasi
        working-directory: openwrt
        run: |
          cp ../ma3063.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y' .config

      - name: Download source
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s

      - name: Build
        working-directory: openwrt
        run: |
          make -j$(($(nproc)+1)) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.openwrt_tag }}-ruijie_rg-ma3063-fwmem${{ inputs.fw_memory_mode }}${{ inputs.ath11k_small_rings && '-smallrings' || '' }}
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*ruijie_rg-ma3063*
            openwrt/bin/targets/qualcommax/ipq50xx/sha256sums
            openwrt/bin/targets/qualcommax/ipq50xx/*.manifest
          if-no-files-found: error
